name: Send to the Mac App Store

# Run this by hand from the Actions tab ("Run workflow") when you want Apple to get a new version.
# It builds the sandboxed App Store version, signs it, and uploads it to App Store Connect,
# where it shows up under TestFlight and can be submitted for review.
# Bump the version in src-tauri/tauri.conf.json first: Apple only accepts each version number once.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect (untick to only check that it builds)"
        type: boolean
        default: true

jobs:
  appstore:
    runs-on: macos-latest
    env:
      MARGINALIA_KEY: ${{ secrets.MARGINALIA_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_CERTS: ${{ secrets.APPLE_APPSTORE_CERTS }}
      INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERT }}
      CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APP_IDENTITY: ${{ secrets.APPLE_APPSTORE_IDENTITY }}
      INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
      API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - name: Check the Apple secrets are set
        run: |
          missing=""
          for v in TEAM_ID APPSTORE_CERTS CERT_PASSWORD APP_IDENTITY INSTALLER_IDENTITY PROFILE API_KEY_ID API_ISSUER API_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first (Settings > Secrets and variables > Actions):$missing"; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyjwt cryptography requests pyyaml

      - name: Load signing certificates
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          echo "$APPSTORE_CERTS" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/certs.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          # The installer certificate can also come on its own (APPLE_INSTALLER_CERT)
          if [ -n "$INSTALLER_CERT" ]; then
            echo "$INSTALLER_CERT" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "::notice title=Identities in keychain::$(security find-identity -v "$KC" | tr '\n' ' ' | cut -c1-600)"

      - name: Add provisioning profile and team ID
        run: |
          echo "$PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile
          sed -i '' "s/TEAM_ID/$TEAM_ID/g" src-tauri/Entitlements.appstore.plist src-tauri/Info.plist

      - name: Build the App Store version
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_APPSTORE_IDENTITY }}
        run: |
          # Each upload needs its own build number; the version (1.0.1 …) comes from tauri.conf.json.
          # The Mac and iPhone/iPad apps share one App Store Connect record, and a build number the other
          # already used is dropped without a word (Mac build 90 met iPhone 1.2.2 build 90). So Mac builds
          # count from 1000 (run 91 is build 1091) and never meet the iPhone's, which count from 1.
          BUILD_NO=$(( ${{ github.run_number }} + 1000 ))
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          echo "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"$BUILD_NO\"}}}" > "$RUNNER_TEMP/build-number.json"
          echo "::notice title=Build number::$BUILD_NO"
          npx tauri build --bundles app --target universal-apple-darwin --config src-tauri/tauri.appstore.conf.json --config "$RUNNER_TEMP/build-number.json"

      - name: Add the Share menu extension and widgets
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          BUILD_NO="$BUILD_NO" python .github/scripts/mac_extensions.py
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          X="$RUNNER_TEMP/macext"
          (cd "$X" && xcodegen generate --spec project.yml > "$RUNNER_TEMP/xg.log" 2>&1) || { echo "::error title=xcodegen::$(tail -20 "$RUNNER_TEMP/xg.log" | tr '\n' ' ')"; exit 1; }
          APP="$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
          mkdir -p "$APP/Contents/PlugIns"
          for t in Share Widgets; do
            kind=$(echo $t | tr 'A-Z' 'a-z')
            if ! xcodebuild -project "$X/ReadingRoomMacExtensions.xcodeproj" -target "ReadingRoomMac$t" -configuration Release \
                SYMROOT="$X/build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/x-$kind.log" 2>&1; then
              echo "::error title=Building the $t extension::$(grep -E 'error:' "$RUNNER_TEMP/x-$kind.log" | head -15 | tr '\n' ' ' | cut -c1-3000)"
              echo "::error title=End of the $t log::$(tail -20 "$RUNNER_TEMP/x-$kind.log" | tr '\n' ' ' | cut -c1-2000)"
              exit 1
            fi
            EX="$X/build/Release/ReadingRoomMac$t.appex"
            cp "$X/$kind.provisionprofile" "$EX/Contents/embedded.provisionprofile"
            codesign --force --sign "$APP_IDENTITY" --entitlements "$X/src/$t/$t.entitlements" "$EX"
            rm -rf "$APP/Contents/PlugIns/ReadingRoomMac$t.appex"
            cp -R "$EX" "$APP/Contents/PlugIns/"
          done
          # sign the app again, now with the extensions sealed inside
          codesign --force --sign "$APP_IDENTITY" --entitlements src-tauri/Entitlements.appstore.plist "$APP"
          codesign --verify --deep --strict "$APP" || { echo "::error title=Signature::The app's signature didn't verify after adding the extensions."; exit 1; }
          echo "::notice title=Extensions::$(ls "$APP/Contents/PlugIns" | tr '\n' ' ')"

      - name: Package for the App Store
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          echo "::notice title=Built bundles::$(ls -R "$BUNDLE" 2>&1 | head -20 | tr '\n' ' ')"
          APP="$(ls -d "$BUNDLE"/macos/*.app | head -1)"
          echo "::notice title=App signature::$(codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier' | tr '\n' ' ')"
          if ! xcrun productbuild --sign "$INSTALLER_IDENTITY" --component "$APP" /Applications "$RUNNER_TEMP/The Reading Room.pkg" > "$RUNNER_TEMP/pb.log" 2>&1; then
            echo "::error title=productbuild::$(tr '\n' ' ' < "$RUNNER_TEMP/pb.log" | cut -c1-2000)"
            exit 1
          fi

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          # altool can report success while Apple's servers answer with errors, so look for its success line,
          # and try again a few times when Apple is having trouble
          ok=""
          for try in 1 2 3; do
            xcrun altool --upload-app --type macos --file "$RUNNER_TEMP/The Reading Room.pkg" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER" > "$RUNNER_TEMP/up.log" 2>&1 || true
            if grep -qiE "UPLOAD SUCCEEDED|No errors uploading" "$RUNNER_TEMP/up.log"; then ok=1; break; fi
            grep -qiE "already been uploaded|bundle version must be higher|ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE" "$RUNNER_TEMP/up.log" && break
            echo "::warning title=Upload try $try::$(tr '\n' ' ' < "$RUNNER_TEMP/up.log" | cut -c1-800)"
            sleep 60
          done
          if [ -z "$ok" ]; then
            echo "::error title=Upload::$(tr '\n' ' ' < "$RUNNER_TEMP/up.log" | cut -c1-3000)"
            exit 1
          fi
          echo "::notice title=Upload::$(tr '\n' ' ' < "$RUNNER_TEMP/up.log" | cut -c1-1000)"

      - uses: actions/upload-artifact@v4
        with:
          name: The-Reading-Room-AppStore-pkg
          path: ${{ runner.temp }}/The Reading Room.pkg
