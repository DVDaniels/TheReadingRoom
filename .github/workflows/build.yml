name: Build Mac app

# Runs on every push to main, and whenever you press "Run workflow" on the Actions tab.
# Each run publishes the .dmg as the GitHub Release for the version in src-tauri/tauri.conf.json
# (for example v0.2.0), replacing that release's installer if it already exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that's still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Install Linux webview libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --lib

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build universal app (Apple silicon + Intel)
        # Signs with your Developer ID, has Apple notarize it, and staples Apple's approval to the
        # download once those secrets exist (see "Publishing" in the README). Otherwise unsigned.
        env:
          DEVID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          DEVID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$DEVID_CERT" ]; then
            echo "::notice title=Signing::No Developer ID secrets yet, so this build is unsigned"
            npx tauri build --target universal-apple-darwin
            exit 0
          fi

          # Put the Developer ID certificate in a keychain of its own for this build
          KC="$RUNNER_TEMP/devid.keychain-db"; KCPW="$(uuidgen)"
          printf '%s' "$DEVID_CERT" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "::notice title=Signing identities::$(security find-identity -v -p codesigning "$KC" | tr '\n' ' ' | cut -c1-400)"

          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          KEY="$HOME/private_keys/AuthKey_$API_KEY_ID.p8"

          # Tauri signs the app (hardened runtime) with the identity from the keychain
          APPLE_SIGNING_IDENTITY="$DEVID_IDENTITY" npx tauri build --target universal-apple-darwin

          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          APP="$BUNDLE/macos/The Reading Room.app"
          DMG="$(ls "$BUNDLE"/dmg/*.dmg)"
          echo "::notice title=App signature::$(codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=Developer|TeamIdentifier|flags' | tr '\n' ' ')"

          # Sign the disk image too, then send it to Apple and wait for the verdict
          codesign --force --timestamp --sign "$DEVID_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/notary.json" || true
          STATUS="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary.json')).get('status','?'))" 2>/dev/null || echo '?')"
          ID="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary.json')).get('id',''))" 2>/dev/null)"
          echo "::notice title=Notarization::Apple says: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error title=Notarization log::/'
            cat "$RUNNER_TEMP/notary.json" | cut -c1-1000 | sed 's/^/::error title=Notarization reply::/'
            exit 1
          fi
          xcrun stapler staple "$DMG"
          echo "::notice title=Gatekeeper check::$(spctl -a -t open --context context:primary-signature -vv "$DMG" 2>&1 | tr '\n' ' ')"
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: The-Reading-Room-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Read app version
        id: version
        run: echo "v=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: The Reading Room ${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download the .dmg below, open it, and drag The Reading Room into Applications (choose Replace when updating).
            Your feeds, folders and read marks are kept.
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
