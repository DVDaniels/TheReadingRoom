name: Build Mac app

# Runs on every push to main, and whenever you press "Run workflow" on the Actions tab.
# Each run publishes the .dmg as the GitHub Release for the version in src-tauri/tauri.conf.json
# (for example v0.2.0), replacing that release's installer if it already exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that's still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Install Linux webview libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --lib

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build universal app (Apple silicon + Intel)
        run: npx tauri build --target universal-apple-darwin
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: The-Reading-Room-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Read app version
        id: version
        run: echo "v=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: The Reading Room ${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download the .dmg below, open it, and drag The Reading Room into Applications (choose Replace when updating).
            Your feeds, folders and read marks are kept.
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
