name: App Store status

# Run by hand to see where the app stands with Apple: review, versions and builds (shown as notes on the run).
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          python .github/scripts/asc_status.py
