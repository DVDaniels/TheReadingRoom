name: Send to iPhone and iPad (TestFlight)

# Run this by hand from the Actions tab ("Run workflow"). It builds the iPhone and iPad app on one of
# GitHub's Macs, signs it, and uploads it to App Store Connect, where it shows up in TestFlight.
# Each run gets its own build number, so you can run it as often as you like.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect (untick to only check that it builds)"
        type: boolean
        default: true
      testers:
        description: "Also send it to the public-link testers (RSS Testers) once Apple has processed it"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-latest
    env:
      MARGINALIA_KEY: ${{ secrets.MARGINALIA_KEY }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # Optional: a certificate and profile made by hand. Without them, Xcode makes its own using the API key.
      HAND_CERT: ${{ secrets.IOS_CERTIFICATE }}
      HAND_CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      HAND_PROFILE: ${{ secrets.IOS_MOBILE_PROVISION }}
      # Otherwise the Mac App Store's Apple Distribution certificate is reused (it signs iPhone apps too)
      APPSTORE_CERTS: ${{ secrets.APPLE_APPSTORE_CERTS }}
      CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
    steps:
      - name: Check the Apple secrets are set
        run: |
          missing=""
          for v in APPLE_DEVELOPMENT_TEAM API_KEY_ID API_ISSUER API_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyjwt cryptography requests pyyaml

      - name: App Store Connect key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          # Sign by hand (Tauri's IOS_* variables): a certificate and profile from the IOS_ secrets if set,
          # otherwise the Apple Distribution certificate plus a profile fetched or made through the API.
          # The app, the Share menu extension and the widgets are each signed with their own profile, so signing
          # is set up here for all three (not through Tauri's IOS_* variables, which only cover the app).
          python .github/scripts/ios_signing.py

      - name: Make the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if ! npx tauri ios init --ci > "$RUNNER_TEMP/init.log" 2>&1; then
            echo "::error title=ios init::$(tail -40 "$RUNNER_TEMP/init.log" | tr '\n' ' ' | cut -c1-3000)"
            exit 1
          fi
          # The Share menu extension and the Home Screen widgets (src-tauri/ios-ext), signed by hand like the app
          BUILD_NO="${{ github.run_number }}" python .github/scripts/ios_extensions.py
          # The new project comes with Tauri's placeholder icon: put ours in (src-tauri/icons/ios, no transparency).
          ICONSET="$(find src-tauri/gen/apple -type d -name 'AppIcon.appiconset' | head -1)"
          [ -n "$ICONSET" ] || { echo "::error::Couldn't find AppIcon.appiconset in the Xcode project."; exit 1; }
          cp src-tauri/icons/ios/*.png "$ICONSET/"
          missing=$(python3 -c "import json,os,sys;d=sys.argv[1];print(' '.join(i['filename'] for i in json.load(open(d+'/Contents.json'))['images'] if i.get('filename') and not os.path.exists(d+'/'+i['filename'])))" "$ICONSET")
          [ -z "$missing" ] || { echo "::error title=App icon::Missing icon files: $missing"; exit 1; }
          echo "::notice title=App icon::Copied $(ls src-tauri/icons/ios/*.png | wc -l | tr -d ' ') icon files into $ICONSET"
          # Not using encryption beyond HTTPS: answer Apple's export question once, in the app itself.
          PLIST="$(find src-tauri/gen/apple -name Info.plist -path '*_iOS*' | head -1)"
          echo "::notice title=Info.plist::$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Reading Room'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Reading Room'" "$PLIST"
          # Listen keeps reading with the screen locked
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

      - name: Build the iPhone and iPad app
        run: |
          BUILD_NO="${{ github.run_number }}"
          echo "::notice title=Build number::$BUILD_NO"
          # Tauri builds and archives; the export (the .ipa) is ours, so it can name all three profiles.
          if ! npx tauri ios build --ci --archive-only \
              --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NO\"}}}" > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "::error title=Rust or Xcode errors::$(grep -E 'error(\[|:)|error: ' "$RUNNER_TEMP/build.log" | head -25 | tr '\n' ' ' | cut -c1-3500)"
            echo "::error title=End of the build log::$(tail -30 "$RUNNER_TEMP/build.log" | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          ARCHIVE="$(find src-tauri/gen/apple/build -name '*.xcarchive' -maxdepth 4 | head -1)"
          [ -n "$ARCHIVE" ] || { echo "::error::The archive wasn't made."; exit 1; }
          echo "::notice title=Archive::$ARCHIVE has $(ls "$ARCHIVE/Products/Applications/"*.app/PlugIns 2>/dev/null | tr '\n' ' ')"
          if ! xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/RRExportOptions.plist" \
              -exportPath src-tauri/gen/apple/build/rr-export > "$RUNNER_TEMP/export.log" 2>&1; then
            echo "::error title=Export::$(grep -iE 'error' "$RUNNER_TEMP/export.log" | head -15 | tr '\n' ' ' | cut -c1-3500)"
            echo "::error title=End of the export log::$(tail -25 "$RUNNER_TEMP/export.log" | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          IPA="$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)"
          [ -n "$IPA" ] || { echo "::error::The build finished but no .ipa was made."; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "::notice title=Built::$IPA ($(du -h "$IPA" | cut -f1))"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          ok=""
          for try in 1 2 3; do
            xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER" > "$RUNNER_TEMP/up.log" 2>&1 || true
            if grep -qiE "UPLOAD SUCCEEDED|No errors uploading" "$RUNNER_TEMP/up.log"; then ok=1; break; fi
            grep -qiE "already been uploaded|bundle version must be higher|DUPLICATE" "$RUNNER_TEMP/up.log" && break
            echo "::warning title=Upload try $try::$(tr '\n' ' ' < "$RUNNER_TEMP/up.log" | cut -c1-800)"
            sleep 60
          done
          if [ -z "$ok" ]; then
            echo "::error title=Upload::$(tr '\n' ' ' < "$RUNNER_TEMP/up.log" | cut -c1-3000)"
            exit 1
          fi
          echo "::notice title=Upload::$(tr '\n' ' ' < "$RUNNER_TEMP/up.log" | cut -c1-1000)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: The-Reading-Room-iOS
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  # Runs on a cheap Linux machine after the upload: waits for Apple, then hands the build to the testers.
  testers:
    needs: ios
    if: ${{ inputs.upload && inputs.testers }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          python .github/scripts/asc_testers.py IOS "${{ github.run_number }}"
