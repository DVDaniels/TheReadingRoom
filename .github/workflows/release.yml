name: Release an update

# Run by hand once Apple has approved the version before. "prepare" makes the new version in App Store
# Connect and fills it in from appstore/<version>/ (What's New, description, promotional text, keywords,
# review notes) with the newest ready build; "submit" sends it to App Review.
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [prepare, submit]
        default: prepare
      platform:
        type: choice
        options: [both, MAC_OS, IOS]
        default: both
      version:
        description: "Version number shown on the App Store"
        default: "1.1.0"
      build:
        description: "Build number (leave empty for the newest ready build)"
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"
          python .github/scripts/asc_release.py "${{ inputs.action }}" "${{ inputs.platform }}" "${{ inputs.version }}" "${{ inputs.build }}"
