[package]
name = "reading-room"
version = "1.1.0"
description = "The Reading Room — a private RSS reader"
authors = ["David Daniels"]
edition = "2021"

[lib]
name = "reading_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
feed-rs = "2"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
regex = "1"
html-escape = "0.2"
quick-xml = "0.36"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }
url = "2"
libc = "0.2"

dom_smoothie = "0.19.0"
ammonia = "4.2.4"
tauri-plugin-icloud-folder = { path = "plugins/icloud-folder" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSString", "NSError", "NSArray"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
