[package]
name = "tauri-plugin-icloud-folder"
version = "0.1.0"
description = "The Reading Room: pick a folder on iPhone and iPad, keep access to it, and bring iCloud files down"
edition = "2021"
links = "tauri-plugin-icloud-folder"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
