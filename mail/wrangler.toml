# The Reading Room's mail service (Cloudflare Worker). Deployed by .github/workflows/mail.yml,
# which fills in database_id. Setup steps: mail/README.md.
name = "reading-room-mail"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# The feeds and the "make an address" button live here
routes = [{ pattern = "mail.readingroomapp.com", custom_domain = true }]

[vars]
MAIL_DOMAIN = "readingroomapp.com"   # addresses look like quiet-river-4821@readingroomapp.com
FEED_HOST = "mail.readingroomapp.com"

[[d1_databases]]
binding = "DB"
database_name = "reading-room-mail"
database_id = "DATABASE_ID"

# Once a day: drop old emails (keeps the last 100 per address, nothing older than a year)
[triggers]
crons = ["17 7 * * *"]
